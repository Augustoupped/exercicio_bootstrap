<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Il tua securitá sei la Nostra</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container"></div>
    <h1> Parla con Noi</h1>
    <form>
        <div class="row"></div>
        <div class="col-sm-6">
            <label for="name" class="form-label">Nome</label>
            <input type="text" class="form-control" id="name" placeholder="Tipo su nome">
        </div>
        <div class="col-sm-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="Tipo su email">
        </div>
        <div class="col-sm-6">
            <label for="message" class="form-label">Messagio</label>
            <textarea class="form-control" id="message" rows="4" placeholder="Tipo su messagio"></textarea>
            <div class="justify-content-end"></div>
        </div>
        <button type="submit" class="btn btn-primary">Inviare</button>

        <footer>
            <div class="container text-center">
                <p>&copy; Criatto per Barbosa, Victor Augusto 2026 Tutti i diritti riservati</p>
            </div>
        </footer>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
