<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadastro - Viagem dos Sonhos</title>
<link rel="stylesheet" href="main.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

</head>

<body>

<div class="container-form">
    <div class="form-box animated">
        <h2 class="form-title text-center">Cadastre-se para a Viagem dos Sonhos</h2>

        <p class="form-subtitle text-center">Preencha seus dados e receba ofertas incríveis para sua próxima aventura!</p>


        <form id="cadastroForm">
        <div class="input-group mb-3">

            <span class="input-group-text"><i class='bx bx-user'></i></span>
            <input type="text" class="form-control" id="nome" placeholder="Seu nome completo" required />
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class='bx bx-envelope'></i></span>
            <input type="email" class="form-control" id="email" placeholder="Seu e-mail" required />
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class='bx bx-phone'></i></span>
            <input type="tel" class="form-control" id="telefone" placeholder="Seu telefone" required />
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="promocoes" />
            <label class="form-check-label" for="promocoes">
            Aceito receber promoções por e-mail
            </label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Enviar Cadastro</button>
        </form>
    </div>

    <div class="image-box">

        <img src="https://images.unsplash.com/photo-1505228395891-9a51e7e86bf6?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1000&q=80" alt="Praia dos Sonhos">
    </div>
</div>


    <p class="footer">© 2025 Viagem dos Sonhos. Todos os direitos reservados.</p>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>

</html>
