<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cadastro - Viagem dos Sonhos</title>
<link rel="stylesheet" href="main.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

</head>

<body>

<div class="container-form">
    <div class="form-box animated">
        <h2 class="form-title text-center">Reserva tuo Appuntamento</h2>

        <p class="form-subtitle text-center">Reservi uno mesi di nostro servizi</p>


        <form id="cadastroForm">
        <div class="input-group mb-3">

            <span class="input-group-text"><i class='bx bx-user'></i></span>
            <input type="text" class="form-control" id="nome" placeholder="Tuo nome completo" required />
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class='bx bx-envelope'></i></span>
            <input type="email" class="form-control" id="email" placeholder="Tuo e-mail" required />
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class='bx bx-phone'></i></span>
            <input type="tel" class="form-control" id="telefone" placeholder="Tuo telefono" required />
        </div>

        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="promocoes" />
            <label class="form-check-label" for="promocoes">
            Acetto di ricevere demonstrazioni del servizi.
            </label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Inviare</button>
        </form>
    </div>

    <div class="image-box">

        <img src="https://ahowsolutions.com.br/wp-content/uploads/2025/05/empresa-de-ti-ahow-soltuions.jpg" alt="pessoas na frente do servidor">
    </div>
</div>


    <p class="footer">© La tua securitá sei nostra forza. Tutti i diritti riservati.</p>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

</body>

</html>
